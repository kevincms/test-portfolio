# Aggregate values from the PDF Arc Probe v0 report and its reviewed LLM Wiki summary.
# This file does not contain raw session logs or per-session measurements.
experiment:
  name: PDF Arc Probe v0
  report_date: 2026-08-26
  status: completed_exploratory
  model: GPT-5.4
  model_settings:
    reasoning_effort: none
    temperature: 0
  agent_tools: [read_file, list_dir, write_file, bash]
  material_type: synthetic_pdf
  material_generator: "pdf-parse-bench (phorn1, MIT license), extended for this probe"
  documents_per_arc: 13
  pages_per_document: 1
  independent_material_arcs: 1
  arms: [C2, C3]
  repetitions_per_arm: 3
  sessions_per_arm: 39
  sessions_total: 78
  sessions_completed: 78

conditions:
  C2: Monolithic persistent context in AGENTS.md.
  C3: AGENTS.md with entry rules and pointers, plus role-based state and knowledge documents.
  not_run: "C0 (no context), C1 (legacy context.md), C-static (fixed rules only)"

reported_aggregates:
  mean_input_tokens_per_session:
    C2: 81841
    C3: 65900
    C3_relative_change_percent: -19.5
  steps_C3_relative_change_percent: -6.0
  input_per_step_C3_relative_change_percent: -14.4
  first_procedure_record_session:
    C2: [7, 1, 1]
    C3: [1, 1, 1]
  procedure_updates_total:
    C2: 11
    C3: 23

