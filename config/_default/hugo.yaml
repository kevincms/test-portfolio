# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://example.com/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
# 시범 배포 중 검색엔진 색인 차단 — static/robots.txt(Disallow /)를 직접 사용. 정식 운영 시 true로 되돌리고 static/robots.txt 삭제
enableRobotsTXT: false
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  # quality/hint는 v0.163.0서 전역 키가 deprecated → 포맷별로 이전(동작 유지: 전역 90/picture)
  jpeg:
    quality: 90
  webp:
    quality: 90
    hint: picture
  avif:
    quality: 90
    hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  # Hugo 바이너리 업그레이드 후 Tailwind v4 transform이 tailwindcss 바이너리를 exec하는데
  # 기본 security.exec.allow에 없어 "access denied: tailwindcss is not whitelisted"로 빌드 실패.
  # _merge:deep는 slice를 병합하지 않고 교체하므로 기존 기본값 전체 + tailwindcss를 명시한다.
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'
sitemap:
  _merge: deep
